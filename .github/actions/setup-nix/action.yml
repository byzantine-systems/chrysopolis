# Shared Nix setup for all CI jobs. The image and VM jobs configure the
# GitHub cache separately, so this action only installs Nix.
name: "Setup Nix"
description: "Reclaim disk space and install Nix"
runs:
  using: "composite"
  steps:
    - uses: wimpysworld/nothing-but-nix@main
      with:
        hatchet-protocol: 'cleave'

    # zig2nix uses bwrap which requires unprivileged user namespaces.
    # Ubuntu's default apparmor_restrict_unprivileged_userns=1 blocks this.
    - name: Enable unprivileged user namespaces
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - uses: cachix/install-nix-action@v31
