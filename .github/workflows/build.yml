# CI pipeline: formatting, compilation safety, image packaging
# and a headless QEMU boot of the synthesized system image.
#
# Staged pipeline (https://nixcademy.com/posts/nixos-integration-test-on-github/):
#   1. treefmt gates everything
#   1b. The pure gates (production SDF, tests/*.erl compile) run in parallel
#      with the image build: seconds each, no QEMU, no cross build to wait on.
#   2. The images (bring-up + ERTS-linked) and the FAT disk build ONCE.
#   3. QEMU smoke tests, at most 3 at a time to stay within shared-runner
#      limits. They restore the images from the cache, build only their own
#      test derivation, and their post-run upload is a few KB of test log.
name: "[Nix] Build & Test"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: "[treefmt] Check formatting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - run: nix build .#checks.x86_64-linux.treefmt --print-build-logs

  # Cheap, pure gate: no QEMU, so it runs alongside the image build rather than
  # behind it. Asserts the test-only restart affordances (the crasher PD and the
  # beam_server -> root debug channels) stay out of the production topology.
  sdf-gate:
    name: "[Nix] Production SDF gate"
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - run: nix build .#checks.x86_64-linux.production-sdf-gate --print-build-logs

  # The other cheap pure gate: compile tests/*.erl. It is a transitive
  # dependency of .#disk anyway, but named here so an Erlang typo fails in
  # under a minute instead of behind the cross build in the image job.
  test-modules:
    name: "[Nix] Compile test probes"
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - run: nix build .#checks.x86_64-linux.test-modules --print-build-logs

  image:
    name: "[Nix] Build images + disk"
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      # Everything the smoke tests boot: the ERTS-linked image, the bring-up
      # image (socket-smoke), the restart image (the *-restart-smoke checks) and
      # the FAT disk they all attach. Built once here so the fanned-out test jobs
      # restore them from the cache instead of each rebuilding them.
      - run: nix build .#test-image .#default .#disk .#restart-image --print-build-logs

  test:
    name: "[QEMU] ${{ matrix.check }}"
    needs: image
    runs-on: ubuntu-latest
    strategy:
      # Let independent smoke tests finish even if one fails.
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.MAX_PARALLEL_JOBS) }}
      matrix:
        check:
          - boot-smoke
          - socket-smoke
          - shell-smoke
          - tcp-smoke
          - rng-smoke
          # Fault detection: root catches a deliberately faulting child, restarts
          # it until the budget is spent, then gives up.
          - restart-smoke
          # BEAM PD recovery: an ERTS exit restarts beam_server to a fresh 1>
          # with none of the previous VM's state.
          - beam-restart-smoke
          # Per-class recovery: a HEALTHY driver is restarted on request and the
          # subsystem must keep working.
          - serial-restart-smoke
          - timer-restart-smoke
          - blk-restart-smoke
          - net-restart-smoke
          # End of the ladder: the restart budget is spent, root stops the
          # driver for good, and the system must degrade rather than wedge.
          - blk-giveup-smoke
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - run: nix build .#checks.x86_64-linux.${{ matrix.check }} --print-build-logs
