# Build images once, transfer their Nix store closure, then run grouped QEMU
# checks. Formatting and pure gates start alongside the image build.
name: "[Nix] Build & Test"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: "[treefmt] Check formatting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - run: python3 nix/ci-check-vm-matrix.py
      - run: nix build .#checks.x86_64-linux.treefmt --print-build-logs

  # Cheap, pure gate: no QEMU, so it runs alongside the image build rather than
  # behind it. Asserts the test-only restart affordances (the crasher PD and the
  # beam_server -> root debug channels) stay out of the production topology.
  sdf-gate:
    name: "[Nix] Production SDF gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - run: nix build .#checks.x86_64-linux.production-sdf-gate --print-build-logs

  # The other cheap pure gate: compile tests/*.erl. It is a transitive
  # dependency of .#disk anyway, but named here so an Erlang typo fails in
  # under a minute instead of behind the cross build in the image job.
  test-modules:
    name: "[Nix] Compile test probes"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - run: nix build .#checks.x86_64-linux.test-modules --print-build-logs

  # Host tests for the pure BEAM logic in src/pd/beam (tests/host). A native
  # Zig build with no cross inputs, so it also runs beside the image build and
  # fails in seconds on a broken boundary or state transition.
  runtime-host-tests:
    name: "[Nix] Runtime host tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - run: nix build .#checks.x86_64-linux.runtime-host-tests --print-build-logs

  # The generated orchestration ABI: contract tests and negative fixtures,
  # staleness of the committed system JSON, byte-identical double generation
  # (inside orchestrator-abi), proof that those gates can fail, and the Erlang
  # codec against the shared golden vectors. Host-only and seconds to minutes.
  abi:
    name: "[Nix] Generated ABI"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - run: >-
          nix build --print-build-logs
          .#checks.x86_64-linux.abi-tool
          .#checks.x86_64-linux.abi-stale
          .#checks.x86_64-linux.abi-negative
          .#checks.x86_64-linux.abi-erlang
          .#checks.x86_64-linux.core-erlang

  image:
    name: "[Nix] Build images + disk"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      # Everything the smoke tests boot: the ERTS-linked image, the bring-up
      # image, every test variant, and their FAT disk. Export their closure to
      # /nix, which has space for it on the CI runner.
      - run: sudo install -d -o "$USER" -g "$USER" /nix/ci-image-transfer
      - run: bash nix/ci-transfer-images.sh export /nix/ci-image-transfer
      # Generate the normalized artifact baseline from these images and check
      # its compact fingerprint against the reviewed value in the repository.
      - run: nix build .#checks.x86_64-linux.phase-zero-baseline --print-build-logs
      - name: Upload image closure
        uses: actions/upload-artifact@v7
        with:
          name: ci-image-closure
          path: /nix/ci-image-transfer/
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  # Root's restart topology read from the Microkit tool's report.txt for both
  # the production and restart images: entries, priorities, fault endpoints,
  # TCB cap slots and restart channels. No QEMU, but it needs the images, so it
  # imports them after the image job.
  restart-topology:
    name: "[Nix] Restart topology"
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - run: sudo install -d -o "$USER" -g "$USER" /nix/ci-image-transfer
      - name: Download image closure
        uses: actions/download-artifact@v8
        with:
          name: ci-image-closure
          path: /nix/ci-image-transfer
      - run: bash nix/ci-transfer-images.sh import /nix/ci-image-transfer
      - run: python3 nix/ci-check-image-store.py restart-topology
      - run: nix build .#checks.x86_64-linux.restart-topology --print-build-logs

  test:
    name: "[QEMU] ${{ matrix.check }}"
    needs: image
    runs-on: ubuntu-latest
    strategy:
      # Let independent groups finish even if one fails.
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.MAX_PARALLEL_JOBS) }}
      matrix:
        check:
          - testbed-boot
          - testbed-restart
          - testbed-orch
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - run: sudo install -d -o "$USER" -g "$USER" /nix/ci-image-transfer
      - name: Download image closure
        uses: actions/download-artifact@v8
        with:
          name: ci-image-closure
          path: /nix/ci-image-transfer
      - run: bash nix/ci-transfer-images.sh import /nix/ci-image-transfer
      # The images must come from the transferred closure. A dry run fails
      # here if any would be built, and its evaluation is reused below.
      - name: Require the imported images
        run: |
          nix build .#checks.x86_64-linux.${{ matrix.check }} --dry-run 2> plan.txt
          if grep -E 'sel4-beam|chrysopolis-fat' plan.txt; then
            echo "these images are missing from the transferred closure" >&2
            exit 1
          fi
      - run: nix build .#checks.x86_64-linux.${{ matrix.check }} --print-build-logs --keep-failed
      # A passing group's reports are its output. A failing one leaves them
      # in the kept build directory.
      - name: Collect reports
        if: always()
        run: |
          mkdir -p testbed-reports
          if [ -e result ]; then
            cp -rL result/. testbed-reports/
          else
            sudo find /nix/var/nix/builds /tmp -maxdepth 3 -type d -name reports \
              -path "*/build/reports" -exec cp -r {}/. testbed-reports/ \; 2>/dev/null || true
            sudo chown -R "$USER" testbed-reports
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testbed-reports-${{ matrix.check }}
          path: testbed-reports
          retention-days: 7
          if-no-files-found: warn
