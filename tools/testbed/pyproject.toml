# Runs scenarios against the Nix-built images under QEMU.
# Dependencies come from the pinned nixpkgs (modules/testbed.nix).
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chryso-testbed"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.11",
    "pyfatfs>=1.1",
    "python-statemachine>=3.2",
    "qemu.qmp>=0.0.6",
    "typer>=0.25",
]

[project.scripts]
chryso-testbed = "chryso_testbed.__main__:app"

[project.optional-dependencies]
test = ["pytest>=9", "hypothesis>=6.150", "hypothesis-jsonschema>=0.23", "pytest-asyncio>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chryso_testbed = ["py.typed"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
files = ["src", "tests", "fuzz"]

[[tool.mypy.overrides]]
module = ["hypothesis.*", "hypothesis_jsonschema.*"]
follow_untyped_imports = true

# pyfatfs has no annotations, and following it infers its attributes from
# their None initialisers. fatlayout.py is the typed boundary instead.
[[tool.mypy.overrides]]
module = ["pyfatfs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-p", "no:cacheprovider"]
xfail_strict = true
